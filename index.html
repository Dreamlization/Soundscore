<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声谱工坊 - AI音频扒谱与音色分离</title>
    
    <!-- 网页图标 -->
    <link rel="icon" type="image/png" href="public/images/ui/webicon.png">
    <link rel="apple-touch-icon" href="public/images/ui/webicon.png">

    <!-- Vue 3 -->
    <script src="public/lib/js/vue.global.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="public/lib/js/tailwindcss.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="public/lib/css/all.min.css">
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        music: ['"Bravura"', '"Noto Music"', '"Apple Symbols"', '"Segoe UI Symbol"', '"Symbola"', 'serif', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#FF2A6D',
                            hover: '#FF4B82',
                            light: 'rgba(255,42,109,0.1)'
                        },
                        dark: {
                            DEFAULT: '#121212',
                            card: '#1A1A1A',
                            border: '#2A2A2A'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="public/css/global.css">
</head>
<body class="min-h-screen flex flex-col">
    <div id="app" class="flex flex-col min-h-screen w-full relative">
        
        <!-- 全局导航栏 (工作台不显示此导航) -->
        <app-header v-if="currentPage !== 'workspace'" :current-page="currentPage" @navigate="currentPage = $event"></app-header>
        
        <!-- 页面内容路由占位 -->
        <main class="flex-grow flex flex-col relative w-full">
            <component 
                :is="'page-' + currentPage" 
                @navigate="currentPage = $event"
                @require-login="handleRequireLogin">
            </component>
        </main>
        
        <!-- 全局弹窗组件 -->
        <login-modal 
            v-if="store.showLoginModal" 
            @close="store.showLoginModal = false"
            @login-success="handleLoginSuccess">
        </login-modal>
        
        <upgrade-modal 
            v-if="store.showUpgradeModal" 
            @close="store.showUpgradeModal = false">
        </upgrade-modal>

        <agreement-modal 
            v-if="store.showAgreementModal" 
            :type="store.agreementType" 
            @close="store.showAgreementModal = false">
        </agreement-modal>
        
        <!-- 简单页脚 (工作台不显示) -->
        <footer v-if="currentPage !== 'workspace'" class="border-t border-dark-border py-8 mt-10 text-center text-sm text-gray-500">
            <p>© 2026 声谱工坊 SoundScore AI. All rights reserved. <span class="text-gray-600 ml-2 font-mono text-xs">Version 4.2</span></p>
            <div class="mt-2 space-x-4">
                <a href="#" @click.prevent="showAgreement('service')" class="hover:text-brand transition">用户服务协议</a>
                <a href="#" @click.prevent="showAgreement('privacy')" class="hover:text-brand transition">隐私政策</a>
                <a href="#" class="hover:text-brand transition">陕ICP备2026xxxx号-1</a>
            </div>
            <p class="mt-4 text-xs text-gray-600 max-w-2xl mx-auto px-4">免责声明：本网站仅作技术演示与学习用途。用户上传的音频如涉及版权纠纷，本平台不承担任何责任。系统会在处理完毕后自动删除临时文件。</p>
        </footer>
    </div>

    <!-- Store & State -->
    <script src="src/store.js"></script>
    
    <!-- Components -->
    <script src="src/components/header.js"></script>
    <script src="src/components/login-modal.js"></script>
    <script src="src/components/upgrade-modal.js"></script>
    <script src="src/components/agreement-modal.js"></script>
    
    <!-- Pages -->
    <script src="src/pages/home.js"></script>
    <script src="src/pages/workspace.js"></script>
    <script src="src/pages/projects.js"></script>
    <script src="src/pages/profile.js"></script>
    <script src="src/pages/about.js"></script>
    
    <!-- Main App Entry -->
    <script src="src/app.js"></script>
</body>
</html>
